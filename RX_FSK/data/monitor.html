<!DOCTYPE html>
<html>
<head>
<!-- LZ4TU-5 UART telemetry mod: page to view graphs of the telemetry data -->
  <title>RDZ UART</title>
  <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> -->
  <script src="/chart.js"></script>
  <script src="/moni.js"></script>
    <style>
	p {text-align: center;}
    div {text-align: center;}
    body {
      background-color: #212121; /* Dark background color */
      color: #fff; /* Light text color */
    }

    table {
      border-collapse: collapse;
      width: 70%;
      margin: auto; /* Center the table */
	  font-size: 12px; /* Adjust the font size */
	  text-align: center;
	  font-family: Verdana, sans-serif; /* Set the font family to Verdana */
    }

    th, td {
      border: 1px solid #dddddd;
      text-align: center;
      padding: 8px;
    }

    .chart-container {
      width: 80%;
      margin: auto; /* Center the chart containers */
    }

    .signature {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #ccc; /* Lighter text color */
    }
	#buttonContainer {
	  display: flex;
	  justify-content: center;
	  align-items: center;
	  height: 20px;
	  <!-- border: 3px solid green;  -->
	}
  </style>
</head>
<body>
  <!-- <p>Telemetry Monitor</p> -->
  <div id="tableContainer"></div>
  <div class="chart-container">
    <canvas id="energyChart" width="400" height="200"></canvas>
  </div>
  <div class="chart-container">
    <canvas id="environmentChart" width="400" height="200"></canvas>
  </div>
  <div class="signature">
    <p>RDZ UART Telemetry Monitor Created with &hearts; by ChatGPT</p>
  </div>
  <div id="buttonContainer">
  <button id="downloadCSVButton">Download CSV</button>
</div>
</body>
</html>
